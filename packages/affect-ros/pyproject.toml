[project]
name = "affect-ros"
version = "0.1.0"
description = "ROS 2 node around the affect engine. rclpy comes from the ROS install, not from PyPI."
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["affect-core", "affect-express", "affect-adapters"]

[tool.uv.sources]
affect-core = { workspace = true }
affect-express = { workspace = true }
affect-adapters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affect_ros"]
