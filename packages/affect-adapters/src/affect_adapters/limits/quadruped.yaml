# The robot's own limits, kept apart from its expression profile on purpose: a bad
# profile must not be able to widen these.
#
# PLACEHOLDERS. These are conservative guesses, not measured values. Replace them
# with the real robot's numbers and review them before connecting hardware. Joint
# torque and velocity limits belong in the robot's own controller, below this layer.
name: quadruped
channels:
  body.height: {min: 0.8, max: 1.05, rate_limit: 0.2, rest: 0.95}
  body.pitch: {min: -0.15, max: 0.15, rate_limit: 0.4, rest: 0.0}
  body.x: {min: -0.04, max: 0.04, rate_limit: 0.2, rest: 0.0}
  body.sway: {min: 0.0, max: 0.8, rate_limit: 1.0, rest: 0.1}
  gait.freq: {min: 0.7, max: 1.3, rate_limit: 0.4, rest: 1.0}
  gait.step_height: {min: 0.8, max: 1.2, rate_limit: 0.4, rest: 1.0}
  impedance.stiffness: {min: 0.8, max: 1.2, rate_limit: 0.4, rest: 1.0}
