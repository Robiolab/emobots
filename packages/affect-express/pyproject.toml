[project]
name = "affect-express"
version = "0.1.0"
description = "Embodiment profiles, the expression mapper and idle motion."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["affect-core", "pyyaml>=6"]

[tool.uv.sources]
affect-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affect_express"]
