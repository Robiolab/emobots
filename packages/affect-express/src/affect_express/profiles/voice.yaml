# Voice prosody, used by the text-to-speech layer on any robot that can speak.
name: voice
channels:
  voice.rate: # multiple of the voice's normal speed
    limits: [0.75, 1.3]
    rest: 1.0
    rate_limit: 10.0
    pad: {arousal: 0.18, pleasure: 0.03}
    labels: {sadness: -0.1, sleepy: -0.1}
  voice.pitch: # semitones
    limits: [-3.0, 3.0]
    rest: 0.0
    rate_limit: 50.0
    pad: {arousal: 1.5, pleasure: 0.8}
    labels: {sadness: -0.8}
  voice.energy: # gain
    limits: [0.6, 1.3]
    rest: 1.0
    rate_limit: 10.0
    pad: {arousal: 0.2, dominance: 0.1}
    labels: {sadness: -0.1}
  voice.pause: # seconds of silence after a sentence
    limits: [0.05, 0.7]
    rest: 0.15
    rate_limit: 10.0
    pad: {arousal: -0.1}
    labels: {sadness: 0.3, sleepy: 0.2}
