# Quadruped with 12 MyActuator joints: whole-body expression and no face.
# These are requests. The adapter holds the robot's own limits and has the last word.
name: quadruped
ttl_s: 0.2
channels:
  body.height: # multiple of nominal standing height
    limits: [0.75, 1.1]
    rest: 0.95
    rate_limit: 0.25
    pad: {dominance: 0.06, pleasure: 0.04}
    labels: {joy: 0.06, sadness: -0.12, fear: -0.18}
    idle: {amplitude: 0.004, freq_hz: 0.3} # breathing
  body.pitch: # radians, positive is head (front) down
    limits: [-0.2, 0.2]
    rest: 0.0
    rate_limit: 0.5
    pad: {dominance: -0.03}
    labels: {sadness: 0.14, joy: -0.04}
    idle: {amplitude: 0.003, freq_hz: 0.2}
  body.x: # metres from the stance centre, positive is forward
    limits: [-0.05, 0.05]
    rest: 0.0
    rate_limit: 0.25
    labels: {fear: -0.04}
  body.sway: # sway amplitude, 0 to 1
    limits: [0.0, 1.0]
    rest: 0.1
    rate_limit: 1.0
    pad: {arousal: 0.2}
    labels: {joy: 0.5, sadness: -0.08}
  gait.freq: # multiple of nominal gait frequency
    limits: [0.6, 1.4]
    rest: 1.0
    rate_limit: 0.5
    pad: {arousal: 0.2}
    labels: {joy: 0.15, sadness: -0.3}
  gait.step_height: # multiple of nominal step height
    limits: [0.7, 1.3]
    rest: 1.0
    rate_limit: 0.5
    pad: {arousal: 0.1, pleasure: 0.1}
    labels: {joy: 0.15, sadness: -0.2}
  impedance.stiffness: # multiple of nominal joint stiffness
    limits: [0.7, 1.3]
    rest: 1.0
    rate_limit: 0.5
    pad: {pleasure: -0.08}
    labels: {fear: 0.3, anger: 0.15, joy: -0.1}
cues:
  nod:
    - {channel: body.pitch, amplitude: 0.08, duration_s: 0.8, cycles: 2}
  listen:
    - {channel: body.height, amplitude: 0.02, duration_s: 0.8}
  think:
    - {channel: body.pitch, amplitude: -0.04, duration_s: 1.2}
  laugh:
    - {channel: body.height, amplitude: 0.03, duration_s: 0.9, cycles: 3}
  step_back:
    - {channel: body.x, amplitude: -0.03, duration_s: 1.0}
