[project]
name = "affect-core"
version = "0.1.0"
description = "Appraisal to PAD, dynamics, personality and labels. No robot or ROS dependency."
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pydantic>=2.6"]

[project.scripts]
affect-core = "affect_core.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affect_core"]
