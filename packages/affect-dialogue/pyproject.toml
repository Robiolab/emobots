[project]
name = "affect-dialogue"
version = "0.1.0"
description = "VAD, STT, LLM, TTS, memory and turn-taking around the affect core."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["affect-core", "affect-express", "httpx>=0.27", "numpy>=1.26"]

[project.optional-dependencies]
claude = ["anthropic>=2"]
speech = ["faster-whisper>=1.2", "piper-tts>=1.8", "sounddevice>=0.5", "onnxruntime>=1.20"]
# Pinned: newer nvidia-cublas-cu12 releases have Linux wheels only.
gpu = ["nvidia-cublas-cu12==12.9.2.10", "nvidia-cudnn-cu12==9.27.0.42"]

[project.entry-points."affect.llm"]
scripted = "affect_dialogue.llm:ScriptedLLM"
claude = "affect_dialogue.llm:ClaudeLLM"
ollama = "affect_dialogue.llm:OllamaLLM"
onemin = "affect_dialogue.llm:OneMinLLM"

[project.entry-points."affect.stt"]
whisper = "affect_dialogue.speech:WhisperSTT"
onemin = "affect_dialogue.speech:OneMinSTT"

[project.entry-points."affect.tts"]
piper = "affect_dialogue.speech:PiperTTS"

[project.entry-points."affect.vad"]
silero = "affect_dialogue.vad:SileroVad"
energy = "affect_dialogue.vad:EnergyVad"

[tool.uv.sources]
affect-core = { workspace = true }
affect-express = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/affect_dialogue"]
