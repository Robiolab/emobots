[project]
name = "emobots"
version = "0.1.0"
description = "Workspace root for the Robot Emotions Engine"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "affect-core",
    "affect-express",
    "affect-adapters",
    "affect-dialogue",
    "affect-server",
    "affect-dash",
    "affect-ros",
]

[project.optional-dependencies]
claude = ["affect-dialogue[claude]"]
speech = ["affect-dialogue[speech]"]
gpu = ["affect-dialogue[gpu]"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
affect-core = { workspace = true }
affect-express = { workspace = true }
affect-adapters = { workspace = true }
affect-dialogue = { workspace = true }
affect-server = { workspace = true }
affect-dash = { workspace = true }
affect-ros = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "anthropic>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["speech: needs the real speech models (uv sync --extra speech, voices in models/piper)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
